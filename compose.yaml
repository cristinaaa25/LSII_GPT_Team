services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-root}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-pwd}
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENV_PROTUBE_DB_USER:-root} -d ${ENV_PROTUBE_DB:-protube}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: protube_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-root}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS:-pwd}
      ENV_PROTUBE_STORE_DIR: /videos/
      PRO_TUBE_LOAD_INITIAL_DATA: "true"
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-dummy-client-id}
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:-dummy-client-secret}
    volumes:
      - ${ENV_PROTUBE_STORE_DIR:-./videos}:/videos

volumes:
  postgres_data:
