spring.application.name=protube-back
server.port=8080
spring.thymeleaf.prefix=classpath:/static/

spring.servlet.multipart.max-file-size=100MB
# Room for a 100MB video plus its thumbnail and form fields
spring.servlet.multipart.max-request-size=110MB

spring.profiles.active=@spring.profiles.active@

# Before running the process you must have this system-level environment variable set: ENV_PROTUBE_STORE_DIR
# It must hold the absolute path to the directory containing the videos (and any other file-based storage)
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR}

# Google login (US-01/US-02). Real credentials live only in the local, git-ignored .env file.
# The dummy defaults let the app and the tests start without them (Google rejects the dummy client).
spring.security.oauth2.client.registration.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# No provider.google.* block: Spring's built-in Google endpoints are used. An issuer-uri would make the app
# download Google's discovery document at startup (network call in tests and CI).

# Where the React SPA lives. Empty = same origin as the API (Docker / packaged jar).
pro_tube.frontend.url=

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
# Vite dev server
pro_tube.frontend.url=${ENV_PROTUBE_FRONTEND_URL:http://localhost:5173}
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

#---
spring.config.activate.on-profile=prod
pro_tube.load_initial_data=false
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

#---
spring.config.activate.on-profile=test
pro_tube.load_initial_data=false
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR:target/test-store/}
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mvc.static-path-pattern=/media/**
logging.level.org.springframework.web=DEBUG


